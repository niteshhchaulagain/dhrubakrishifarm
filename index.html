<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/main/main.css">
    <link rel="stylesheet" href="styles/main/side-nav-bar.css">
    <link rel="stylesheet" href="styles/main/media-query.css">
    <link rel="icon" type="image/png" href="images/images/logo-dhurba-krishi-farm.png">
    <title>Dhruba Krishi Farm</title>
  </head>
  <body>
    <nav aria-label="Main Navigation">
      <div class="sidebar">
        <a href="#" class="js-hide-sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
          </svg>
        </a>
        <a href="index.html">Home</a>
        <a href="learn.html">Learn</a>
        <a href="market.html">Market</a>
        <a href="blog.html">Blogs</a>
        <a href="about.html">About Us</a>
        <a href="login.html">Login/Register</a>
      </div>
      <div class="main-nav-bar">
        <div class="div-logo-menu">
          <div class="company-logo">
            <a href="#" class="company-logo-a">
              <img class="company-logo-img" src="images/images/logo-dhurba-krishi-farm.png" alt="">
            </a>
          </div>
          <div class="menu-icon">
            <a href="#" class="menu-icon-a js-show-sidebar">
              <img class="menu-icon-img" src="images/icons/hamburger-menu-48.png" alt="">
            </a>
          </div>
        </div>
        <div class="div-main-navigations">
          <div class="navigation-links">
            <a href="learn.html" target="_blank">Learn</a>
            <a href="market.html" target="_blank">Market</a>
            <a href="blog.html" target="_blank">Blogs</a>
            <a href="about.html" target="_blank">About Us</a>
          </div>
          <div class="search-container-div">
            <search class="search-container">
              <form action="/search-results" method="GET">
                <input type="search" class="search-input-box" id="site-search" name="q" placeholder="Search Products" required>
                <button class="search-button" type="submit">
                  <img class="search-button-img" src="images/icons/search.png" alt="">
                </button>
              </form>
            </search>
          </div>
        </div>
        <div class="div-cart-profile">
          <div class="cart-icon-div">
            <a href="cart.html" target="_blank" class="cart-logo-img div-cart-profile-a">
              <img class="cart-icon" src="images/icons/shopping-cart-icon.png" alt="">
            </a>
          </div>
          <div class="profile-pic-div">
            <a href="login.html" target="_blank" class="account-profile-img div-cart-profile-a">
              <img class="account-logo" src="images/icons/account-logo.png" alt="">
            </a>
            <div class="cart-notification">
              2
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="main">
      <div class="products-grid js-product-grid">
        <div class="product-container">
          <div class="product-image-container">
            <img class="product-image" src="/images/products/angle-grinder.png" alt="">
          </div>
          <div class="product-name">
            <p class="product-name-p">
              Angle Grinder Gray Athletic Cotton
            </p>
          </div>
          <div class="product-rating-container">
            <img class="product-rating-stars" src="images/ratings/rating-50.png" alt="" >
            <p class="product-rating-count-p">127</p>
          </div>
          <div class="product-price-container">
            <span class="product-price-currency">रु. </span>
            <span class="product-price-amount">1500<span class="standard-unit">/piece</span></span>
            
          </div>
          <div class="product-quantity-container">
            <div class="quantity-text">
              <span class="quantity-span">Quantity: </span>
            </div>
            <div class="quantity-slider-container">
              <div class="minus-quantity-slider align-quantity-divs"><button class="minus-button quantity-buttons"><img src="/images/icons/remove.png" alt=""></button></div>
              <div class="align-quantity-divs"><input type="text" class="quantity-input"></div>
              <div class="plus-quantity-slider align-quantity-divs"><button class="plus-button quantity-buttons"><img src="/images/icons/add.png" alt=""></button></div>
            </div>
          </div>
          <div class="product-spacer"></div>
          <div class="added-to-cart-container">
            <img class="added-tick-image" src="images/icons/checkmark.png" alt="">
            <p class="added-to-cart-text">Added</p>
          </div>
          <div class="add-to-cart-btn">
            <button class="add-to-cart">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="scripts/main/main-nav.js"></script>
    <script type="module" src="scripts/main/main.js"></script>
  </body>
</html>
